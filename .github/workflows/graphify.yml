# Rigenera e salva automaticamente il knowledge graph di graphify.
# Gira a ogni push su main che tocca il codice: se il grafo cambia,
# il workflow fa commit di graphify-out/ direttamente su main.
# I branch di lavoro non toccano il grafo, così le PR non vanno in conflitto.
name: graphify

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa graphify
        run: pip install graphifyy==0.9.108

      - name: Rigenera il grafo (solo AST, nessun LLM)
        run: graphify update . --force

      - name: Salva il grafo se è cambiato
        run: |
          git add -A graphify-out
          if git diff --cached --quiet; then
            echo "Grafo già aggiornato, niente da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(graphify): aggiorna il knowledge graph a ${GITHUB_SHA::7}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
