<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant AI Terminal</title>

    <!-- Font Finanziari Professionale -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#09090b',
                        surface: '#121215',
                        borderSubtle: 'rgba(255, 255, 255, 0.08)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-zinc-800">

    <!-- Navbar -->
    <header class="border-b border-borderSubtle bg-surface/80 backdrop-blur-md sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div id="statusIndicator" class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="font-semibold text-sm tracking-wide uppercase text-zinc-300">QUANT-AI TERMINAL</span>
            <span class="text-xs px-2 py-0.5 rounded border border-zinc-800 bg-zinc-900 text-zinc-400 font-mono" id="botStatusText">Inizializzazione...</span>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="triggerScan()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
                <i data-lucide="zap" class="w-3.5 h-3.5"></i> SCAN ORA
            </button>
            <button onclick="toggleBot()" id="btnToggle" class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-borderSubtle text-xs font-semibold px-3 py-1.5 rounded transition">
                <i data-lucide="pause" class="w-3.5 h-3.5"></i> PAUSA BOT
            </button>
            <button onclick="liquidateAll()" class="flex items-center gap-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
                <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> VENDI TUTTO
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-6 flex flex-col gap-6 max-w-[1800px] w-full mx-auto">
        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Valore Portafoglio -->
            <div class="bg-surface border border-borderSubtle rounded-lg p-5 flex flex-col justify-between">
                <div class="flex items-center justify-between text-zinc-400">
                    <span class="text-xs font-semibold uppercase tracking-wider">Valore Portafoglio</span>
                    <i data-lucide="wallet" class="w-4 h-4 text-zinc-500"></i>
                </div>
                <div class="mt-4">
                    <div class="text-2xl font-bold tabular-nums text-white" id="portfolioValue">--</div>
                    <div class="text-xs text-zinc-500 mt-1 font-mono" id="portfolioPnL">PnL: --</div>
                </div>
            </div>

            <!-- Cash Disponibile -->
            <div class="bg-surface border border-borderSubtle rounded-lg p-5 flex flex-col justify-between">
                <div class="flex items-center justify-between text-zinc-400">
                    <span class="text-xs font-semibold uppercase tracking-wider">Cash Disponibile</span>
                    <i data-lucide="dollar-sign" class="w-4 h-4 text-zinc-500"></i>
                </div>
                <div class="mt-4">
                    <div class="text-2xl font-bold tabular-nums text-white" id="cashBalance">--</div>
                    <div class="text-xs text-zinc-500 mt-1 font-mono" id="cashRatio">Quota Cash: --</div>
                </div>
            </div>

            <!-- Ultima Scansione -->
            <div class="bg-surface border border-borderSubtle rounded-lg p-5 flex flex-col justify-between">
                <div class="flex items-center justify-between text-zinc-400">
                    <span class="text-xs font-semibold uppercase tracking-wider">Ultima Scansione</span>
                    <i data-lucide="clock" class="w-4 h-4 text-zinc-500"></i>
                </div>
                <div class="mt-4">
                    <div class="text-2xl font-bold tabular-nums text-white font-mono" id="lastScanTime">--:--:--</div>
                    <div class="text-xs text-zinc-500 mt-1 font-mono" id="lastScanStatus">Stato: In attesa</div>
                </div>
            </div>
        </div>

        <!-- Terminal Log Live -->
        <div class="flex-1 bg-surface border border-borderSubtle rounded-lg flex flex-col min-h-[460px] overflow-hidden">
            <div class="px-5 py-3 border-b border-borderSubtle flex items-center justify-between bg-zinc-950/40">
                <div class="flex items-center gap-2">
                    <i data-lucide="terminal" class="w-4 h-4 text-zinc-400"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider text-zinc-300">Terminal Log Live</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearLogs()" class="text-xs text-zinc-400 hover:text-zinc-200 px-2 py-1 rounded hover:bg-zinc-800 transition">
                        Pulisci
                    </button>
                </div>
            </div>
            <div id="terminalContainer" class="flex-1 p-4 font-mono text-xs overflow-y-auto custom-scrollbar bg-black/60 text-zinc-300 space-y-1.5 selection:bg-zinc-700">
                <div class="text-zinc-500">[SYSTEM] Connessione al terminale stabilita...</div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        let isRunning = true;

        function addLog(message, type = 'info') {
            const container = document.getElementById('terminalContainer');
            if (!container) return;
            const row = document.createElement('div');
            
            let color = 'text-zinc-300';
            if (type === 'error') color = 'text-rose-400';
            if (type === 'success') color = 'text-emerald-400';
            if (type === 'warn') color = 'text-amber-400';
            if (type === 'system') color = 'text-cyan-400';

            const time = new Date().toLocaleTimeString('it-IT');
            row.className = `${color} leading-relaxed break-all`;
            row.textContent = `[${time}] ${message}`;

            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function clearLogs() {
            const container = document.getElementById('terminalContainer');
            if (container) {
                container.innerHTML = '<div class="text-zinc-500">[SYSTEM] Log puliti.</div>';
            }
        }

        async function fetchStatus() {
            try {
                let res = await fetch('/api/data');
                if (!res.ok) {
                    res = await fetch('/api/status');
                }
                if (!res.ok) throw new Error(`HTTP status ${res.status}`);

                const data = await res.json();

                // Portfolio Value
                const val = data.portfolio_value ?? data.equity;
                if (val !== undefined) {
                    document.getElementById('portfolioValue').textContent = typeof val === 'number' 
                        ? `$${val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                        : val;
                }

                // PnL
                if (data.pnl !== undefined) {
                    document.getElementById('portfolioPnL').textContent = `PnL: ${data.pnl}`;
                }

                // Cash
                const cash = data.cash;
                if (cash !== undefined) {
                    document.getElementById('cashBalance').textContent = typeof cash === 'number'
                        ? `$${cash.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                        : cash;
                }

                // Cash Ratio / Buying Power
                if (data.cash_ratio !== undefined) {
                    document.getElementById('cashRatio').textContent = `Quota Cash: ${data.cash_ratio}`;
                } else if (data.buying_power !== undefined) {
                    document.getElementById('cashRatio').textContent = `Buying Power: $${Number(data.buying_power).toFixed(2)}`;
                }

                // Last Scan
                if (data.last_scan) {
                    document.getElementById('lastScanTime').textContent = data.last_scan;
                } else {
                    document.getElementById('lastScanTime').textContent = new Date().toLocaleTimeString('it-IT');
                }

                if (data.scan_status) {
                    document.getElementById('lastScanStatus').textContent = `Stato: ${data.scan_status}`;
                } else {
                    document.getElementById('lastScanStatus').textContent = `Stato: Attivo`;
                }

                // Live Terminal Logs
                if (Array.isArray(data.logs) && data.logs.length > 0) {
                    const container = document.getElementById('terminalContainer');
                    container.innerHTML = data.logs.map(l => `<div class="text-zinc-300 leading-relaxed break-all">${l}</div>`).join('');
                    container.scrollTop = container.scrollHeight;
                }

                if (data.is_running !== undefined) {
                    isRunning = Boolean(data.is_running);
                } else {
                    isRunning = true;
                }
                updateBotStatusDisplay();

            } catch (err) {
                document.getElementById('botStatusText').textContent = 'In attesa risposta backend...';
                document.getElementById('statusIndicator').className = 'h-2.5 w-2.5 rounded-full bg-amber-500 animate-pulse';
            }
        }

        function updateBotStatusDisplay() {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('botStatusText');
            const btn = document.getElementById('btnToggle');

            if (!indicator || !text || !btn) return;

            if (isRunning) {
                indicator.className = 'h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse';
                text.textContent = 'ATTIVO';
                text.className = 'text-xs px-2 py-0.5 rounded border border-emerald-900 bg-emerald-950 text-emerald-400 font-mono';
                btn.innerHTML = '<i data-lucide="pause" class="w-3.5 h-3.5"></i> PAUSA BOT';
            } else {
                indicator.className = 'h-2.5 w-2.5 rounded-full bg-amber-500';
                text.textContent = 'IN PAUSA';
                text.className = 'text-xs px-2 py-0.5 rounded border border-amber-900 bg-amber-950 text-amber-400 font-mono';
                btn.innerHTML = '<i data-lucide="play" class="w-3.5 h-3.5"></i> AVVIA BOT';
            }
            lucide.createIcons();
        }

        async function triggerScan() {
            addLog('Avvio scansione manuale...', 'system');
            try {
                const res = await fetch('/api/scan', { method: 'POST' });
                const data = await res.json();
                addLog(data.message || 'Scansione completata con successo', 'success');
                fetchStatus();
            } catch (err) {
                addLog('Errore durante la scansione: ' + err.message, 'error');
            }
        }

        async function toggleBot() {
            try {
                const res = await fetch('/api/toggle', { method: 'POST' });
                const data = await res.json();
                isRunning = data.is_running !== undefined ? data.is_running : !isRunning;
                updateBotStatusDisplay();
                addLog(isRunning ? 'Bot riavviato' : 'Bot messo in pausa', 'warn');
            } catch (err) {
                addLog('Errore cambio stato bot: ' + err.message, 'error');
            }
        }

        async function liquidateAll() {
            if (!confirm('SEI SICURO? Questa azione chiuderà TUTTE le posizioni aperte su Alpaca.')) return;
            addLog('INVIO ORDINE DI LIQUIDAZIONE TOTALE...', 'error');
            try {
                const res = await fetch('/api/liquidate', { method: 'POST' });
                const data = await res.json();
                addLog(data.message || 'Liquidazione completata.', 'success');
                fetchStatus();
            } catch (err) {
                addLog('Errore liquidazione: ' + err.message, 'error');
            }
        }

        // Auto-polling ogni 3 secondi
        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
