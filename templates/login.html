<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant AI Terminal · Accesso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#09090b',
                        surface: '#121215',
                        borderSubtle: 'rgba(255, 255, 255, 0.08)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased px-4">
    <form method="post" action="/login" class="w-full max-w-sm bg-surface border border-borderSubtle rounded-lg p-6 space-y-5">
        <div class="flex items-center gap-3">
            <div class="h-2.5 w-2.5 rounded-full bg-emerald-500"></div>
            <span class="font-semibold text-sm tracking-wide uppercase text-zinc-300">QUANT-AI TERMINAL</span>
        </div>

        <label class="block">
            <span class="text-[10px] text-zinc-400 uppercase tracking-wider">Password Dashboard</span>
            <input type="password" name="password" required autofocus autocomplete="current-password"
                   class="mt-1 w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 font-mono text-sm text-zinc-200 focus:outline-none focus:border-cyan-700">
        </label>

        {% if error %}
        <div class="text-xs font-mono text-rose-400">{{ error }}</div>
        {% endif %}

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded transition">
            ACCEDI
        </button>
    </form>
</body>
</html>
